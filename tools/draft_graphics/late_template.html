<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Late Adds Graphic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0d1220;--ink:#e8ecf4;--muted:#8a94a8;--accent:#f5a524;
    --t-QB:#e9b949;--t-S:#ef5a4c;--t-A:#f5a524;--t-B:#3fbf75;--t-C:#4b9ce8;--t-D:#a07ee0;--t-NA:#6c7689}
  *{box-sizing:border-box}
  body{margin:0;background:#070a12;color:var(--ink);font-family:Inter,system-ui,sans-serif}
  .gallery{display:flex;justify-content:center;padding:16px}
  .fit{position:relative;width:min(540px,calc(100vw - 32px));aspect-ratio:1080/1350;overflow:hidden;border-radius:10px}
  .art{position:absolute;left:0;top:0;width:1080px;height:1350px;transform-origin:0 0;overflow:hidden;font-family:Inter,sans-serif;
    background:radial-gradient(900px 520px at 100% -8%, #f5a52433, transparent 60%), repeating-linear-gradient(135deg,#ffffff05 0 2px,transparent 2px 22px), var(--bg);padding:48px 56px 0}
  .brand{display:flex;align-items:center;gap:12px;font:600 24px Oswald;letter-spacing:.16em;color:var(--accent);text-transform:uppercase}
  .top{display:flex;justify-content:space-between;align-items:flex-end}
  .title{font:700 112px/0.9 Oswald;text-transform:uppercase;margin-top:10px}
  .title span{color:transparent;-webkit-text-stroke:2px var(--accent);margin-left:18px}
  .meta{text-align:right;color:var(--muted);font:600 19px Oswald;letter-spacing:.12em;text-transform:uppercase;line-height:1.55}
  .meta b{color:var(--ink);font-size:30px;letter-spacing:.04em}
  .intro{margin-top:16px;color:#c4cbd8;font:500 22px Inter}
  .list{position:absolute;left:56px;right:56px;top:270px;bottom:96px;display:flex;flex-direction:column;gap:26px}
  .hs{border-radius:50%;overflow:hidden;background:#232c40;border:5px solid var(--tc,#6c7689);display:flex;align-items:center;justify-content:center;flex:none;color:var(--tc);font:700 60px Oswald}
  .hs img{width:100%;height:100%;object-fit:cover}
  .card{flex:1;display:flex;flex-direction:column;border-radius:22px;overflow:hidden;background:#131a2a;border:1px solid #ffffff14;min-height:0}
  .body{flex:1;display:flex;align-items:center;gap:34px;padding:26px 30px;min-height:0}
  .photo{position:relative}
  .clogo{position:absolute;right:-4px;bottom:4px;width:74px;height:74px;border-radius:50%;background:#0d1220;border:3px solid #232c40;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .clogo img{width:52px;height:52px;object-fit:contain} .clogo b{font:700 20px Oswald;color:#c4cbd8}
  .info{flex:1;min-width:0}
  .k{font:800 15px Inter;letter-spacing:.24em;color:#f1d39a;text-transform:uppercase}
  .nm{font:700 76px/0.95 Oswald;text-transform:uppercase;margin-top:8px}
  .nick{font:600 26px Inter;color:var(--accent);margin-top:10px}
  .chips{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:16px}
  .tier{white-space:nowrap;display:inline-flex;align-items:center;padding:4px 12px;border-radius:7px;font:700 22px Oswald;letter-spacing:.06em;color:var(--tc);background:color-mix(in srgb,var(--tc) 22%,#111)}
  .chip{color:#c4cbd8;font:600 20px Inter;white-space:nowrap}
  .bio{margin-top:12px;color:var(--muted);font:600 19px Inter}
  .comp{display:flex;align-items:center;gap:12px;margin-top:14px}
  .comp img{width:48px;height:48px;border-radius:50%;object-fit:cover;background:#232c40}
  .comp .ck{color:var(--muted);font:700 13px Inter;letter-spacing:.12em;text-transform:uppercase}
  .comp .cv{font:700 22px Oswald;text-transform:uppercase} .comp .cv small{font:500 16px Inter;color:#c4cbd8;text-transform:none;margin-left:6px}
  .hon{margin-top:10px;color:#f1d39a;font:600 18px Inter}
  .joins{display:flex;align-items:center;gap:18px;padding:16px 30px;background:linear-gradient(100deg,color-mix(in srgb,var(--team) 42%,#151c2c),#151c2c 75%);border-top:1px solid color-mix(in srgb,var(--team) 55%,transparent)}
  .joins .arrow{font:700 22px Inter;letter-spacing:.2em;color:#f1d39a}
  .joins .tn{font:700 40px/1 Oswald;text-transform:uppercase}
  .joins .cp{color:#c4cbd8;font:600 17px Inter;margin-top:4px}
  .joins .ros{margin-left:auto;text-align:right;font:700 15px Inter;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
  .joins .ros b{display:block;font:700 40px/1 Oswald;color:var(--ink);letter-spacing:0}
  .foot{position:absolute;left:56px;right:56px;bottom:30px;display:flex;justify-content:space-between;align-items:center;color:var(--muted);font:600 17px Inter}
  .url{color:var(--accent);font:600 20px Oswald;letter-spacing:.12em}
  /* one or three players */
  .n1 .nm{font-size:96px} .n3 .body{padding:16px 26px;gap:26px} .n3 .nm{font-size:58px} .n3 .bio,.n3 .comp,.n3 .hon{display:none}
  .n3 .joins{padding:10px 26px} .n3 .joins .tn{font-size:30px} .n3 .joins .ros b{font-size:30px}
</style></head>
<body>
<div class="gallery"><div class="fit" id="fit"></div></div>
<script>
const DATA = /*DATA*/null;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ini = n => n.split(/\s+/).map(w => w[0]).join("").slice(0, 3);
const hs = (src, name, size, tc) => `<div class="hs" style="width:${size}px;height:${size}px;--tc:${tc};font-size:${size * .3}px">${src ? `<img src="${esc(src)}" alt="">` : esc(ini(name))}</div>`;
// College logo: dark-background version, then the regular one (same as the site), then the school's initials.
const LOGOS = id => /^n-/.test(id) ? ["bgd", "bgl"].map(v => `https://www.ncaa.com/sites/default/files/images/logos/schools/${v}/${id.slice(2)}.svg`)
  : ["500-dark", "500"].map(v => `https://a.espncdn.com/i/teamlogos/ncaa/${v}/${id}.png`);
const logoImg = c => { const [a, b] = LOGOS(String(c.id)), i = esc(ini(c.name));
  return `<img src="${a}" alt="" onerror="if(!this.dataset.f){this.dataset.f=1;this.src='${b}'}else this.replaceWith(Object.assign(document.createElement('b'),{textContent:'${i}'}))">`; };
const teamBadge = (t, size) => t.logo && !/^data:/.test(t.logo)
  ? `<div class="hs" style="width:${size}px;height:${size}px;--tc:${t.color};background:${t.color};font-size:${size * .55}px;border-width:3px">${esc(t.logo)}</div>`
  : hs(t.logo || t.img, t.cap, size, t.color).replace('class="hs"', 'class="hs" data-b="1"');
const tierLbl = t => t === "NA" ? "Unranked" : t + " Tier";

function card(p, n){
  const size = n === 1 ? 330 : n === 2 ? 250 : 170, t = p.team;
  return `<div class="card">
    <div class="body">
      <div class="photo">${hs(p.img, p.name, size, `var(--t-${p.tier})`)}${p.college ? `<div class="clogo">${p.college.id ? logoImg(p.college) : `<b>${esc(ini(p.college.name))}</b>`}</div>` : ""}</div>
      <div class="info">
        <div class="k">🆕 Late add · ${esc(p.move)}</div>
        <div class="nm">${esc(p.name)}</div>
        ${p.nick ? `<div class="nick">“${esc(p.nick)}”</div>` : ""}
        <div class="chips"><span class="tier" style="--tc:var(--t-${p.tier})">${tierLbl(p.tier)}</span>${p.rank ? `<span class="chip">FLEX #${p.rank} on the board</span>` : ""}${p.college ? `<span class="chip">${p.rank ? "· " : ""}${esc(p.college.name)}</span>` : ""}</div>
        ${p.bio.length ? `<div class="bio">${p.bio.map(esc).join(" · ")}</div>` : ""}
        ${p.comp ? `<div class="comp"><img src="${esc(p.comp.img)}" alt="" onerror="this.style.visibility='hidden'"><div><div class="ck">Player comp</div><div class="cv">${esc(p.comp.name)}<small>${esc(p.comp.team || "")}</small></div></div></div>` : ""}
        ${p.honors.length ? `<div class="hon">${p.honors.slice(0, 3).map(esc).join(" · ")}</div>` : ""}
      </div>
    </div>
    <div class="joins" style="--team:${t.color}">${teamBadge(t, n === 3 ? 48 : 64)}
      <div><div class="arrow">JOINS ➜</div><div class="tn">${esc(t.name)}</div><div class="cp">Captain ${esc(t.cap)}</div></div>
      <div class="ros">Roster now<b>${p.roster}</b></div></div>
  </div>`;
}
function slide(d){
  const n = Math.min(d.players.length, 3);
  return `<div class="art n${n}">
    <div class="top"><div><div class="brand">🦃 Turkey Bowl ${d.season}</div><div class="title">Late<span>Adds</span></div></div>
      <div class="meta"><b>${d.players.length} new player${d.players.length > 1 ? "s" : ""}</b><br>signed after the draft<br>no pick needed</div></div>
    <div class="intro">${d.players.length > 1 ? "They missed the draft, so the commissioners" : "He missed the draft, so the commissioners"} put ${d.players.length > 1 ? "them" : "him"} straight on a team.</div>
    <div class="list">${d.players.slice(0, 3).map(p => card(p, n)).join("")}</div>
    <div class="foot"><span>Every roster on the site</span><span class="url">THETURKEYBOWL.WEB.APP</span></div>
  </div>`;
}
const SINGLE = /*SINGLE*/null;
if (SINGLE !== null) { document.body.style.background = "#0d1220"; document.body.innerHTML = slide(DATA); document.querySelector(".art").style.position = "relative"; }
else { const f = document.getElementById("fit"); f.innerHTML = slide(DATA); const fit = () => { f.firstElementChild.style.transform = `scale(${f.clientWidth / 1080})`; }; addEventListener("resize", fit); fit(); }
</script>
</body></html>
