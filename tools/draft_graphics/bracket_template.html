<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bracket Graphic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="base">
  :root{--bg:#0d1220;--ink:#e8ecf4;--muted:#8a94a8;--accent:#f5a524}
  *{box-sizing:border-box}
  body{margin:0;background:#070a12;color:var(--ink);font-family:Inter,system-ui,sans-serif}
  .gallery{display:flex;justify-content:center;padding:16px}
  .fit{position:relative;width:min(540px,calc(100vw - 32px));aspect-ratio:1080/1350;overflow:hidden;border-radius:10px}
  .art{position:absolute;left:0;top:0;width:1080px;height:1350px;transform-origin:0 0;overflow:hidden;font-family:Inter,sans-serif;
    background:radial-gradient(900px 520px at 100% -8%, #f5a52433, transparent 60%), repeating-linear-gradient(135deg,#ffffff05 0 2px,transparent 2px 22px), var(--bg);padding:46px 56px 0}
  .brand{display:flex;align-items:center;gap:12px;font:600 24px Oswald;letter-spacing:.16em;color:var(--accent);text-transform:uppercase}
  .top{display:flex;justify-content:space-between;align-items:flex-end}
  .title{font:700 100px/0.9 Oswald;text-transform:uppercase;margin-top:10px}
  .title span{color:transparent;-webkit-text-stroke:2px var(--accent)}
  .meta{text-align:right;color:var(--muted);font:600 19px Oswald;letter-spacing:.12em;text-transform:uppercase;line-height:1.55}
  .meta b{color:var(--ink);font-size:30px;letter-spacing:.04em}
  .board{margin:26px -24px 0;padding:14px 10px 8px;border-radius:18px;background:#0f1525;border:1px solid #ffffff14}
  .board .br-svg{display:block;width:100%;height:auto}
  .strip{margin-top:24px;display:grid;grid-template-columns:1.25fr 1fr;gap:14px}
  .card{border-radius:16px;background:#131a2a;border:1px solid #ffffff14;padding:14px 18px}
  .k{font:700 13px Inter;letter-spacing:.2em;color:var(--muted);text-transform:uppercase}
  .hs{border-radius:50%;overflow:hidden;background:#232c40;border:3px solid var(--tc,#6c7689);display:flex;align-items:center;justify-content:center;flex:none;color:var(--tc);font:700 16px Oswald}
  .hs img{width:100%;height:100%;object-fit:cover}
  .tm{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #ffffff0c}
  .tm:last-child{border-bottom:0}
  .tm .n{flex:1;font:700 20px Oswald;text-transform:uppercase;letter-spacing:.02em;white-space:nowrap}
  .tm .rec{font:700 20px Oswald;width:44px;text-align:right}
  .tag{font:700 11px Inter;letter-spacing:.06em;padding:3px 8px;border-radius:999px;white-space:nowrap;text-transform:uppercase}
  .tag.wb{background:#123222;color:#5fd68f} .tag.lb{background:#3a2a10;color:#f2b35a} .tag.out{background:#2a1a1d;color:#ef6b5f} .tag.ch{background:#3a2e0e;color:var(--accent)}
  .tm.out{opacity:.5}
  .nx .gt{display:flex;align-items:baseline;justify-content:space-between;margin-top:6px}
  .nx .gt b{font:700 30px Oswald} .nx .gt span{font:700 24px Oswald;color:var(--accent)}
  .nx .rd{color:#c4cbd8;font:600 15px Inter;margin-top:2px}
  .nx .vs{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
  .nx .sd{display:flex;flex-direction:column;align-items:center;gap:6px;width:44%;text-align:center;font:700 19px/1.1 Oswald;text-transform:uppercase}
  .nx .vx{font:800 18px Oswald;color:var(--muted)}
  .rules{margin-top:12px;color:#c4cbd8;font:600 14px/1.5 Inter}
  .rules b{color:var(--ink)}
  .champ{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;background:linear-gradient(140deg,color-mix(in srgb,var(--team) 40%,#1a1408),#141a28);border-color:var(--accent)}
  .champ .cn{font:700 40px/1 Oswald;text-transform:uppercase}
  .champ .cs{color:#f1d39a;font:600 16px Inter}
  .foot{position:absolute;left:56px;right:56px;bottom:30px;display:flex;justify-content:space-between;align-items:center;color:var(--muted);font:600 17px Inter}
  .url{color:var(--accent);font:600 20px Oswald;letter-spacing:.12em}
</style>
<style id="svgcss"></style>
</head>
<body>
<div class="gallery"><div class="fit" id="fit"></div></div>
<script>
const DATA = /*DATA*/null;
document.getElementById("svgcss").textContent = DATA.css.replace(/min-width:720px;?/g, "");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ini = n => n.split(/\s+/).map(w => w[0]).join("").slice(0, 3);
const hs = (t, size) => t ? (t.logo && !/^data:/.test(t.logo)
    ? `<div class="hs" style="width:${size}px;height:${size}px;--tc:${t.color};background:${t.color};font-size:${size * .55}px">${esc(t.logo)}</div>`
    : `<div class="hs" style="width:${size}px;height:${size}px;--tc:${t.color}">${t.logo || t.img ? `<img src="${esc(t.logo || t.img)}" alt="">` : esc(ini(t.cap))}</div>`)
  : `<div class="hs" style="width:${size}px;height:${size}px;border-style:dashed;--tc:#3a4560">?</div>`;
function slide(d){
  const status = d.champion ? "Final" : d.played ? `After Game ${d.last}` : "Before kickoff";
  const tag = t => t.champ ? `<span class="tag ch">Champion</span>` : t.out ? `<span class="tag out">Out</span>` : t.l === 1 ? `<span class="tag lb">Losers bkt</span>` : `<span class="tag wb">Winners bkt</span>`;
  const teams = `<div class="card"><div class="k">Teams · ${d.played} of ${d.champion ? d.played : "10-11"} games played</div>
      ${d.teams.map(t => `<div class="tm${t.out ? " out" : ""}">${hs(t, 38)}<span class="n">${esc(t.name)}</span><span class="rec">${t.w}-${t.l}</span>${tag(t)}</div>`).join("")}</div>`;
  const right = d.champion
    ? `<div class="card champ" style="--team:${d.champion.color}"><div class="k" style="color:var(--accent)">🏆 ${d.season} Champion</div>${hs(d.champion, 120)}<div class="cn">${esc(d.champion.name)}</div><div class="cs">Captain ${esc(d.champion.cap)} · ${d.champion.losses ? "came back from the losers bracket" : "undefeated"}</div></div>`
    : d.next ? `<div class="card nx"><div class="k">${d.played ? "Up next" : "First game"}</div>
        <div class="gt"><b>GAME ${d.next.n}</b><span>~${d.next.time}</span></div><div class="rd">${esc(d.next.round)}</div>
        <div class="vs"><div class="sd">${hs(d.next.a, 70)}${d.next.a ? esc(d.next.a.name) : "TBD"}</div><div class="vx">VS</div><div class="sd">${hs(d.next.b, 70)}${d.next.b ? esc(d.next.b.name) : "TBD"}</div></div>
        <div class="rules"><b>Double elimination:</b> lose once and you drop to the losers bracket, lose twice and you're out. The losers-bracket team has to win the final twice.</div></div>`
    : `<div class="card"><div class="k">Schedule</div><div class="rules">The schedule lottery hasn't been drawn yet.</div></div>`;
  return `<div class="art">
    <div class="top"><div><div class="brand">🦃 Turkey Bowl ${d.season}</div><div class="title">The <span>Bracket</span></div></div>
      <div class="meta"><b>${status}</b><br>Game 1 · ${d.start} · ${d.minutes}-min games<br>double elimination</div></div>
    <div class="board">${d.svg}</div>
    <div class="strip">${teams}${right}</div>
    <div class="foot"><span>Live scores on the site</span><span class="url">THETURKEYBOWL.WEB.APP</span></div>
  </div>`;
}
const SINGLE = /*SINGLE*/null;
if (SINGLE !== null) { document.body.style.background = "#0d1220"; document.body.innerHTML = slide(DATA); document.querySelector(".art").style.position = "relative"; }
else { const f = document.getElementById("fit"); f.innerHTML = slide(DATA); const fit = () => { f.firstElementChild.style.transform = `scale(${f.clientWidth / 1080})`; }; addEventListener("resize", fit); fit(); }
</script>
</body></html>
